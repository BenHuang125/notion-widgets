<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path of life</title>
<style>
  :root{--bg:#F7F6F3;--card:#FFFFFF;--ink:#37352F;--text:#55534E;--soft:#9A9384;--line:#D6D3CD;--brown:#976D57;--hover:#EDEAE4;
    --hr:#C9A58F;--biz:#8C9A6E;--phd:#7E8FA6;--done:#6E8B5E;--warn:#B5651D;
    --serif:Georgia,"Noto Serif TC","Times New Roman",serif;
    --sans:-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light;height:100%}
  body{min-height:100%;display:flex;flex-direction:column;justify-content:center;overflow-x:hidden}
  body.overflow{justify-content:flex-start;overflow-y:auto}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  /* Same space above and below; the frame's leftover height is split evenly (body centres .wrap). */
  .wrap{position:relative;padding:16px 18px 16px}

  .tools{display:flex;justify-content:flex-end;gap:2px;margin-top:6px}
  .tools a{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;color:var(--soft)}
  .tools a:hover,.tools a:focus-visible{background:var(--hover);color:var(--brown);outline:none}
  .tools svg{width:17px;height:17px}

  .goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
  .goal{display:flex;align-items:center;gap:12px;min-width:0}
  .goal svg{flex:0 0 60px}
  .goal .t{font-size:14px;font-weight:600;margin-bottom:3px}
  .goal .s{font-size:12px;color:var(--text);line-height:1.55}
  .goal .s b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .late{color:var(--warn)}

  .scroll{overflow-x:auto;margin-top:14px;padding-bottom:2px}
  .track{position:relative;display:grid;padding-top:40px}
  .rail{position:absolute;top:83px;height:2px;background:var(--line)}
  .rail .fill{position:absolute;inset:0 auto 0 0;background:var(--brown)}
  .now{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;color:var(--brown);white-space:nowrap}
  .now::after{content:"";display:block;width:1px;height:20px;background:var(--brown);margin:4px auto 0}
  .yr{display:flex;flex-direction:column;align-items:center;padding:0 5px;min-width:0}
  .age{font-family:var(--serif);font-size:24px;line-height:1;height:26px}
  .age small{font-size:12px;color:var(--soft);margin-left:2px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line);margin:10px 0 8px;position:relative;z-index:1}
  .yr.past .dot{background:var(--brown);border-color:var(--brown)}
  .yr.cur .dot{border-color:var(--brown)}
  .date{font-size:11px;color:var(--soft);letter-spacing:.06em;margin-bottom:10px;font-variant-numeric:tabular-nums}
  .tips{display:flex;flex-direction:column;gap:6px;width:100%}
  .tip{font-size:12.5px;line-height:1.45;padding:7px 8px;background:var(--card);border-left:3px solid var(--c);overflow-wrap:anywhere}
  .tip.done{color:var(--soft)}
  .tip.done .n::before{content:"✓ ";color:var(--done);font-weight:700}
  .tip .sub{display:block;font-size:11px;color:var(--soft);margin-top:2px}
  .msg{padding:20px 0;font-size:13px;color:var(--soft)}
  @media (prefers-reduced-motion:no-preference){.arc{transition:stroke-dasharray .8s ease}}
</style>
</head>
<body>
<div class="wrap">
  <div class="goals" id="goals"><p class="msg">載入中…</p></div>
  <div class="scroll"><div class="track" id="track"></div></div>
  <nav class="tools" aria-label="工具">
    <a id="sync" target="_blank" rel="noopener" title="立即更新" aria-label="立即更新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/></svg>
    </a>
    <a id="edit" target="_blank" rel="noopener" title="在 Notion 編輯" aria-label="在 Notion 編輯">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.8 2.8 0 0 0-4-4L4 16v4"/><path d="M13.5 6.5l4 4"/></svg>
    </a>
  </nav>
</div>
<script type="module">
import { loadPlan, taipeiToday, monthsUntil, parseAge, colorFor, escapeHtml, BIRTHDAY, NOTION_EDIT_URL, SYNC_NOW_URL } from "./plan.js";

const goalsEl = document.getElementById("goals");
const track = document.getElementById("track");
const sync = document.getElementById("sync");
document.getElementById("edit").href = NOTION_EDIT_URL;
sync.href = SYNC_NOW_URL;
const R = 25, L = 2 * Math.PI * R;

function renderGoals(plan, today) {
  goalsEl.innerHTML = plan.goals.map((g) => {
    const p = g.total ? g.done / g.total : 0;
    const left = monthsUntil(g.date, today);
    const when = g.date ? g.date.slice(0, 7).replace("-", "/") : "";
    const line = left === null ? "" : left >= 0
      ? `距離 ${when} 還有 <b>${left}</b> 個月`
      : `<span class="late">${when} 已到期</span>`;
    const arc = p > 0
      ? `<circle class="arc" cx="30" cy="30" r="${R}" fill="none" stroke="${colorFor(g.category)}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(L * p).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 30 30)"/>`
      : "";
    return `<div class="goal">
      <svg viewBox="0 0 60 60" width="60" height="60" role="img" aria-label="${escapeHtml(g.name)}：完成 ${g.done}/${g.total}">
        <circle cx="30" cy="30" r="${R}" fill="none" stroke="var(--line)" stroke-width="5"/>${arc}
        <text x="30" y="35" text-anchor="middle" font-size="14" fill="var(--ink)" font-family="Georgia,serif">${g.done}/${g.total}</text>
      </svg>
      <div style="min-width:0"><p class="t">${escapeHtml(g.name)}</p><p class="s">完成 ${g.done}/${g.total} 項<br>${line}</p></div>
    </div>`;
  }).join("") || '<p class="msg">Notion 的「五年目標」還沒有資料。</p>';
}

function renderRoad(plan, today) {
  const cols = plan.ages.map((label) => ({ label, ...parseAge(label) })).filter((c) => c.year);
  const n = cols.length;
  if (!n) { track.innerHTML = '<p class="msg">Notion 的「年紀」選單還沒有選項。</p>'; return; }
  const bday = (y) => new Date(y, BIRTHDAY.month - 1, BIRTHDAY.day);
  const first = cols[0], last = cols[n - 1];
  track.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
  track.style.minWidth = `${n * 118}px`;
  const half = 50 / n;
  let html = `<div class="rail" style="left:${half}%;right:${half}%"><div class="fill" id="fill"></div></div>`;
  for (const c of cols) {
    const state = today >= bday(c.year + 1) ? "past" : today >= bday(c.year) ? "cur" : "";
    const tips = plan.milestones.filter((m) => m.age === c.label).map((m) => {
      const left = monthsUntil(m.date, today);
      const late = !m.done && left !== null && left < 0;
      const sub = late ? `<span class="sub late">⚠ 已過目標日期</span>` : m.note ? `<span class="sub">${escapeHtml(m.note)}</span>` : "";
      return `<div class="tip${m.done ? " done" : ""}" style="--c:${colorFor(m.category)}"><span class="n">${escapeHtml(m.name)}</span>${sub}</div>`;
    }).join("");
    html += `<div class="yr ${state}"><div class="age">${c.age}<small>歲</small></div><div class="dot"></div><div class="date">${c.year} APR</div><div class="tips">${tips}</div></div>`;
  }
  const frac = Math.min(1, Math.max(0, (today - bday(first.year)) / ((bday(last.year) - bday(first.year)) || 1)));
  const born = new Date(first.year - first.age, BIRTHDAY.month - 1, BIRTHDAY.day);
  const ageNow = ((today - born) / (365.25 * 864e5)).toFixed(1);
  html += `<div class="now" style="left:${half + frac * (100 - 2 * half)}%">現在 ${ageNow} 歲</div>`;
  track.innerHTML = html;
  document.getElementById("fill").style.width = `${frac * 100}%`;
}


// Notion embeds have a fixed height that only the user can drag, and they ignore
// resize messages from the page. So the widget fits itself to whatever height the
// frame has: centred with equal space above and below when there is room, scaled
// down (to 80% at most) when content grows, and scrollable only beyond that.
const MIN_SCALE = 0.8;
const wrap = document.querySelector(".wrap");
function fit() {
  wrap.style.zoom = 1;
  document.body.classList.remove("overflow");
  const need = wrap.offsetHeight, have = window.innerHeight;
  if (need <= have) return;
  const scale = Math.max(MIN_SCALE, have / need);
  wrap.style.zoom = scale;
  if (need * scale > have + 1) document.body.classList.add("overflow");
}
new ResizeObserver(fit).observe(document.documentElement);
window.addEventListener("resize", fit);

loadPlan().then((plan) => {
  const today = taipeiToday();
  renderGoals(plan, today);
  renderRoad(plan, today);
  fit();
}).catch(() => {
  goalsEl.innerHTML = '<p class="msg">暫時讀不到資料，請稍後重新整理。</p>';
});
</script>
</body>
</html>
