name: Sync plan from Notion

on:
  workflow_dispatch:   # run by hand from the widget's update button

permissions:
  contents: write   # commit data/plan.json

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the Notion key is set
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Read Notion
        run: npm run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Commit changes
        run: |
          if git diff --quiet -- data/plan.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plan.json
          git commit -m "Sync plan from Notion"
          git push

