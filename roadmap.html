<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path of life</title>
<style>
  :root{--bg:#F7F6F3;--card:#FFFFFF;--ink:#37352F;--text:#55534E;--soft:#9A9384;--line:#D6D3CD;--brown:#976D57;
    --hr:#C9A58F;--biz:#8C9A6E;--phd:#7E8FA6;--done:#6E8B5E;--warn:#B5651D;
    --serif:Georgia,"Noto Serif TC","Times New Roman",serif;
    --sans:-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){:root{--bg:#262523;--card:#2F2E2B;--ink:#E9E6E0;--text:#D6D3CD;--soft:#A8A29A;--line:#45423E;--brown:#C9A58F;
    --hr:#D2B29E;--biz:#A6B489;--phd:#9EAFC6;--done:#93B083;--warn:#E0A060}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .wrap{padding:18px 18px 14px}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--brown);letter-spacing:.01em}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  .scroll{overflow-x:auto;padding-bottom:4px;margin-top:10px}
  .track{position:relative;display:grid;padding-top:44px;min-width:700px}
  .rail{position:absolute;top:87px;height:2px;background:var(--line)}
  .rail .fill{position:absolute;inset:0 auto 0 0;background:var(--brown)}
  .now{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;color:var(--brown);white-space:nowrap;text-align:center}
  .now::after{content:"";display:block;width:1px;height:22px;background:var(--brown);margin:4px auto 0}
  .yr{display:flex;flex-direction:column;align-items:center;padding:0 5px;min-width:0}
  .age{font-family:var(--serif);font-size:24px;line-height:1;height:26px}
  .age small{font-size:12px;color:var(--soft);margin-left:2px}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--line);margin:10px 0 8px;position:relative;z-index:1}
  .yr.past .dot{background:var(--brown);border-color:var(--brown)}
  .yr.cur .dot{border-color:var(--brown)}
  .date{font-size:11px;color:var(--soft);letter-spacing:.06em;margin-bottom:10px;font-variant-numeric:tabular-nums}
  .tips{display:flex;flex-direction:column;gap:6px;width:100%}
  .tip{font-size:12.5px;line-height:1.45;padding:7px 8px;background:var(--card);border-left:3px solid var(--c);color:var(--ink);overflow-wrap:anywhere}
  .tip.done{color:var(--soft)}
  .tip.done .n::before{content:"✓ ";color:var(--done);font-weight:700}
  .tip .sub{display:block;font-size:11px;color:var(--soft);margin-top:2px}
  .tip .late{color:var(--warn)}
  .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--soft)}
  .foot a{color:var(--brown);text-decoration:none}
  .foot a:hover,.foot a:focus-visible{text-decoration:underline}
  .warn{color:var(--warn)}
  .msg{padding:24px 0;font-size:13px;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 id="title">Path of life</h1>
    <div class="legend"><span><i style="background:var(--hr)"></i>HR 職涯</span><span><i style="background:var(--biz)"></i>創業</span><span><i style="background:var(--phd)"></i>PhD</span></div>
  </div>
  <div class="scroll"><div class="track" id="track"><p class="msg">載入中…</p></div></div>
  <div class="foot" id="foot"></div>
</div>
<script type="module">
import { loadPlan, taipeiToday, monthsUntil, parseAge, colorFor, escapeHtml, syncLooksStopped, BIRTHDAY, NOTION_EDIT_URL, SYNC_NOW_URL } from "./plan.js";

const track = document.getElementById("track");
const foot = document.getElementById("foot");

function render(plan) {
  const today = taipeiToday();
  const cols = plan.ages.map((label) => ({ label, ...parseAge(label) })).filter((c) => c.year);
  const n = cols.length;
  if (!n) { track.innerHTML = '<p class="msg">Notion 的「年紀」選單還沒有選項。</p>'; return; }

  const bday = (y) => new Date(y, BIRTHDAY.month - 1, BIRTHDAY.day);
  const first = cols[0], last = cols[n - 1];
  document.getElementById("title").textContent = `Path of life · ${first.age} → ${last.age}`;

  track.style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
  track.style.minWidth = `${n * 118}px`;

  const half = 50 / n;
  let html = `<div class="rail" style="left:${half}%;right:${half}%"><div class="fill" id="fill"></div></div>`;

  for (const [i, c] of cols.entries()) {
    const start = bday(c.year), next = bday(c.year + 1);
    const state = today >= next ? "past" : today >= start ? "cur" : "";
    const items = plan.milestones.filter((m) => m.age === c.label);
    const tips = items.map((m) => {
      const left = monthsUntil(m.date, today);
      const late = !m.done && left !== null && left < 0;
      const sub = late ? `<span class="sub late">⚠ 已過目標日期</span>` : m.note ? `<span class="sub">${escapeHtml(m.note)}</span>` : "";
      return `<div class="tip${m.done ? " done" : ""}" style="--c:${colorFor(m.category)}"><span class="n">${escapeHtml(m.name)}</span>${sub}</div>`;
    }).join("");
    html += `<div class="yr ${state}">
      <div class="age">${c.age}<small>歲</small></div><div class="dot"></div>
      <div class="date">${c.year} APR</div><div class="tips">${tips}</div></div>`;
  }

  // "Now" marker: position between the first and last birthday on the rail.
  const span = bday(last.year) - bday(first.year);
  const frac = Math.min(1, Math.max(0, (today - bday(first.year)) / (span || 1)));
  const born = new Date(first.year - first.age, BIRTHDAY.month - 1, BIRTHDAY.day);
  const ageNow = ((today - born) / (365.25 * 864e5)).toFixed(1);
  const left = half + frac * (100 - 2 * half);
  html += `<div class="now" style="left:${left}%">現在 ${ageNow} 歲</div>`;
  track.innerHTML = html;
  document.getElementById("fill").style.width = `${frac * 100}%`;

  const stopped = syncLooksStopped(plan, today);
  foot.innerHTML = `<span>${stopped
      ? `<span class="warn">同步好像停了</span>，<a href="${SYNC_NOW_URL}" target="_blank" rel="noopener">按這裡重新執行</a>`
      : `在 Notion 改的內容約一小時內會更新 · <a href="${SYNC_NOW_URL}" target="_blank" rel="noopener">立即更新</a>`}</span>
    <a href="${NOTION_EDIT_URL}" target="_blank" rel="noopener">在 Notion 編輯 →</a>`;
}

loadPlan().then(render).catch(() => {
  track.innerHTML = '<p class="msg">暫時讀不到資料，請稍後重新整理。</p>';
});
</script>
</body>
</html>
