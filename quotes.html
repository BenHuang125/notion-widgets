<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,400&display=swap">
<style>
/* Notion 首頁語錄框：木畫框＋會自己生活的變色龍（Ben 2026-10-23 定案） */
:root{
  --page:#FFFFFF;          /* Notion 頁面白 */
  --ink:#2B2622;           /* 一般文字 */
  --muted:#7D7368;         /* 說明文字 */
  --topBg:#4A3426;         /* 上半部 深咖啡 */
  --topText:#FBF6EC;       /* 上半部 象牙白字 */
  --lowBg:#EADFCF;         /* 下半部 淺咖啡 */
  --lowText:#6A4A34;       /* 下半部字色（可切換） */
  --rule:rgba(201,163,106,.55); /* 中間細分隔 */
  --accent:#6E2A30;        /* 酒紅點綴 */
  --line:#E7E1D8;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--ui);margin:0}
html,body{height:100%;overflow:hidden}
/* ── 嵌入框本體 ── */
#widget{position:relative;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#panel{position:absolute;display:flex;flex-direction:column;overflow:hidden}
#top{flex:0 0 54%;background:var(--topBg);display:flex;align-items:center;justify-content:center;padding:0 34px}
#rule{flex:0 0 1px;background:var(--rule)}
#bot{flex:1 1 auto;background:var(--lowBg);display:flex;align-items:flex-start;justify-content:center;padding:9px 34px 0}
.qline{white-space:nowrap;max-width:100%;transition:opacity .7s ease;text-align:center}
#qBot.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#err{position:absolute;right:4px;bottom:0;font:11px Georgia,serif;color:#8A6A52}
#qTop{font-family:var(--serif);font-weight:600;color:var(--topText);line-height:1.3;letter-spacing:.005em}
#qBot{font-family:var(--serif);font-style:italic;color:var(--lowText);line-height:1.4;transition:opacity .7s ease,color .4s ease}
.ch{display:inline-block;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.fade{opacity:0}
#world{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#widget.over{cursor:pointer}

#widget.shelf-over{cursor:pointer}
/* ── 語錄收藏（點書架打開，蓋在整個框上） ── */
#shelf{position:absolute;inset:0;z-index:5;background:var(--page);display:flex;flex-direction:column;opacity:0;transform:scale(.97);transform-origin:96% 0;transition:opacity .25s ease,transform .25s ease}
#shelf.open{opacity:1;transform:none}
#shelf[hidden]{display:none}
#shelf textarea{user-select:text;-webkit-user-select:text}
.shelf-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 2px;border-bottom:1px solid var(--line)}
.shelf-head h2{margin:0;font:600 15px/1 var(--serif);color:var(--topBg);letter-spacing:.01em}
.shelf-head .count{font:12px var(--ui);color:var(--muted)}
.shelf-head .sp{flex:1}
.ibtn{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--topBg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:hover{background:#F3EDE3}
.ibtn:focus-visible,.tool:focus-visible,.ebtn:focus-visible,.undo:focus-visible{outline:2px solid var(--gold,#C9A36A);outline-offset:1px}
.ibtn svg{width:16px;height:16px}
#shelfAdd{background:var(--topBg);color:var(--topText)}
#shelfAdd:hover{background:#5A4130}
#shelfList{flex:1 1 auto;overflow-y:auto;padding:8px 2px 12px;scrollbar-width:thin;scrollbar-color:#D8C9B2 transparent}
.pair{margin:0 0 7px;border-radius:3px;overflow:hidden;box-shadow:0 1px 0 rgba(63,43,29,.08)}
.pd{background:var(--topBg);display:flex;align-items:baseline;gap:10px;padding:7px 10px 7px 12px}
.pl{background:var(--lowBg);display:flex;align-items:baseline;gap:12px;padding:5px 12px 6px 42px}
.no{flex:0 0 20px;font:600 11px var(--serif);color:#C9A36A;font-variant-numeric:tabular-nums}
.ph{flex:1;margin:0;font:600 14.5px/1.35 var(--serif);color:var(--topText)}
.pb{flex:1;margin:0;font:italic 13px/1.4 var(--serif);color:var(--lowText)}
.at{flex:0 0 auto;font:11px var(--serif);color:#9A8572;font-variant-numeric:tabular-nums}
.tools{flex:0 0 auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.pair:hover .tools,.pair:focus-within .tools{opacity:1}
.tool{width:24px;height:24px;border:0;border-radius:5px;background:transparent;color:#E6D3B4;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.tool:hover{background:rgba(255,255,255,.12);color:#FFF}
.tool svg{width:14px;height:14px}
.pair.fresh{animation:fresh 1.6s ease}
@keyframes fresh{0%{box-shadow:0 0 0 2px rgba(201,163,106,.9),0 0 16px rgba(230,190,110,.7)}100%{box-shadow:0 1px 0 rgba(63,43,29,.08)}}
.editing .pd{padding:6px 10px 6px 12px}
.editing .pl{padding:6px 12px 7px 12px;flex-wrap:wrap}
.editing textarea{width:100%;resize:none;overflow:hidden;border:0;background:transparent;padding:2px 0;margin:0;outline:none}
.eh{font:600 14.5px/1.35 var(--serif);color:var(--topText)}
.eh::placeholder{color:rgba(251,246,236,.45)}
.eb{font:italic 13px/1.4 var(--serif);color:var(--lowText)}
.eb::placeholder{color:rgba(106,74,52,.5)}
textarea.bad::placeholder{color:#E8A0A0}
.ebar{flex:1 0 100%;display:flex;align-items:center;gap:6px;padding-top:4px}
.ehint{flex:1;font:11px var(--ui);color:#9A8572}
.ebtn{border:0;border-radius:5px;padding:4px 12px;font:12px var(--ui);background:var(--topBg);color:var(--topText);cursor:pointer}
.ebtn.ghost{background:transparent;color:var(--lowText)}
.ebtn.ghost:hover{background:rgba(74,52,38,.08)}
.shelf-empty,.shelf-warn{margin:14px 4px;font:italic 13px var(--serif);color:var(--muted)}
.shelf-warn{color:var(--accent);font-style:normal;font-family:var(--ui);font-size:12px}
#shelfToast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;display:flex;gap:12px;align-items:center;background:#2B2622;color:#FBF6EC;font:12px var(--ui);padding:6px 8px 6px 12px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#shelfToast[hidden]{display:none}
.undo{border:0;background:transparent;color:#E6C88F;font:600 12px var(--ui);cursor:pointer;padding:2px 4px}
@media (prefers-reduced-motion:reduce){.ch,.qline,#shelf{transition:none}.pair.fresh{animation:none}}
</style>
</head>
<body>
<div id="widget" aria-label="Quote with a chameleon living on the frame">
  <div id="panel">
    <div id="top"><div class="qline" id="qTop"></div></div>
    <div id="rule"></div>
    <div id="bot"><div class="qline" id="qBot"></div></div>
  </div>
  <canvas id="world"></canvas>
  <div id="err" hidden></div>
  <section id="shelf" hidden aria-label="Quote shelf">
    <div class="shelf-head">
      <button class="ibtn" id="shelfBack" title="Back to the frame" aria-label="Back to the frame"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>Quote Shelf</h2><span class="count" id="shelfCount"></span><span class="sp"></span>
      <button class="ibtn" id="shelfAdd" title="Add a quote" aria-label="Add a quote"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div id="shelfList"></div>
  </section>
  <div id="shelfToast" role="status" hidden></div>
</div>
<script src="quotes/data.js?v=8"></script>
<script src="quotes/core.js?v=8"></script>
<script src="quotes/chameleon.js?v=8"></script>
<script src="quotes/scene.js?v=8"></script>
<script src="quotes/shelf.js?v=8"></script>
</body>
</html>
