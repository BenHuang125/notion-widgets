<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,400&display=swap">
<style>
/* Notion 首頁語錄框：木畫框＋會自己生活的變色龍（Ben 2026-10-23 定案） */
:root{
  --page:#FFFFFF;          /* Notion 頁面白 */
  --ink:#2B2622;           /* 一般文字 */
  --muted:#7D7368;         /* 說明文字 */
  --topBg:#4A3426;         /* 上半部 深咖啡 */
  --topText:#FBF6EC;       /* 上半部 象牙白字 */
  --lowBg:#EADFCF;         /* 下半部 淺咖啡 */
  --lowText:#6A4A34;       /* 下半部字色（可切換） */
  --rule:rgba(201,163,106,.55); /* 中間細分隔 */
  --accent:#6E2A30;        /* 酒紅點綴 */
  --line:#E7E1D8;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --ui:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--ui);margin:0}
html,body{height:100%;overflow:hidden}
/* ── 嵌入框本體 ── */
#widget{position:relative;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#panel{position:absolute;display:flex;flex-direction:column;overflow:hidden}
#top{flex:0 0 54%;background:var(--topBg);display:flex;align-items:center;justify-content:center;padding:0 34px}
#rule{flex:0 0 1px;background:var(--rule)}
#bot{flex:1 1 auto;background:var(--lowBg);display:flex;align-items:flex-start;justify-content:center;padding:9px 34px 0}
.qline{white-space:nowrap;max-width:100%;transition:opacity .7s ease;text-align:center}
#qTop{font-family:var(--serif);font-weight:600;color:var(--topText);line-height:1.3;letter-spacing:.005em}
#qBot{font-family:var(--serif);font-style:italic;color:var(--lowText);line-height:1.4;transition:opacity .7s ease,color .4s ease}
.ch{display:inline-block;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.fade{opacity:0}
#world{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#widget.over{cursor:pointer}

@media (prefers-reduced-motion:reduce){.ch,.qline{transition:none}}
</style>
</head>
<body>
<div id="widget" aria-label="Quote with a chameleon living on the frame">
  <div id="panel">
    <div id="top"><div class="qline" id="qTop"></div></div>
    <div id="rule"></div>
    <div id="bot"><div class="qline" id="qBot"></div></div>
  </div>
  <canvas id="world"></canvas>
</div>
<script src="quotes/core.js?v=7"></script>
<script src="quotes/chameleon.js?v=7"></script>
<script src="quotes/scene.js?v=7"></script>
</body>
</html>
