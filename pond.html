<title>金魚池</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: the pond fills the whole window (the Notion embed box), whatever size it is dragged to.
     #inspect keeps a framed stage with its controls underneath. */
  :root{
    --ground:#ECE5D7;        /* page around the banner */
    --ink:#5B5246;           /* caption ink */
    --hair:#D9D0BF;          /* hairline under the stage */
    --font-cap:"Noto Serif TC","Songti TC","PMingLiU",serif;
    color-scheme:light;
  }
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);margin:0}
  #wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
        padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
  #stage{position:relative;width:min(100%,calc((100vh - 90px)*3));aspect-ratio:3/1;max-width:100%;
         box-shadow:0 1px 0 var(--hair);background:#F3EEE3}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
  #cap{margin:0;font:13px/1.5 var(--font-cap);letter-spacing:.08em;opacity:.7}
  body:not(.inspect){overflow:hidden}
  body:not(.inspect) #wrap{padding:0;gap:0;height:100%}
  body:not(.inspect) #stage{width:100%;height:100%;aspect-ratio:auto;box-shadow:none}
  body:not(.inspect) #cap{display:none}
  #err{position:absolute;inset:0;display:none;place-items:center;font:15px/1.6 var(--font-cap);text-align:center;padding:16px}
  /* #inspect: one fish, free 360° view */
  .inspect #stage{aspect-ratio:16/10;width:min(100%,calc((100vh - 200px)*1.6))}
  .inspect #stage canvas{cursor:grab}
  #insp{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;max-width:960px;font:13px/1.4 var(--font-cap)}
  #insp .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #insp .lab{opacity:.65;letter-spacing:.08em;margin-right:2px}
  #insp button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--hair);border-radius:3px;padding:5px 10px;cursor:pointer}
  #insp button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  #insp button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  #insp .read{opacity:.65;font-variant-numeric:tabular-nums;min-width:12ch}
</style>
<main id="wrap">
  <div id="stage"><canvas id="c"></canvas><div id="err">這台瀏覽器無法開啟 3D 繪圖（WebGL2），請用新版 Chrome、Edge 或 Safari。</div></div>
  <p id="cap"></p>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ═════════════ 0. small math kit ═════════════ */
const TAU=Math.PI*2, R=Math.random;
const rand=(a,b)=>a+(b-a)*R();
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
function hash(i,j,s){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function vn(x,y,s){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return lerp(lerp(hash(i,j,s),hash(i+1,j,s),u),lerp(hash(i,j+1,s),hash(i+1,j+1,s),u),v);}
const fbm=(x,y,s)=>vn(x,y,s)*.5+vn(x*2.03,y*2.03,s+5)*.28+vn(x*4.1,y*4.1,s+9)*.14+vn(x*8.3,y*8.3,s+13)*.08;
const n1=(x,s)=>vn(x,.37,s)*2-1;
function curve(pts,u){const f=clamp(u,0,1)*(pts.length-1),i=Math.min(pts.length-2,Math.floor(f)),t=f-i;
  const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);}   // Catmull-Rom

/* ═════════════ 1. stage, renderer, cameras ═════════════ */
const stage=document.getElementById('stage'), canvas=document.getElementById('c');
const INSPECT=location.hash==='#inspect'; if(INSPECT) document.body.classList.add('inspect');
// the world is 5 units tall and as wide as the window's shape (the pond fills the embed box); #inspect keeps 3:1
const ASP=INSPECT?3:Math.min(8,Math.max(1.5,(stage.clientWidth||1500)/(stage.clientHeight||500)));
const WH=5, WW=WH*ASP;
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true}); if(!renderer.capabilities.isWebGL2) throw 0;}
catch(e){document.getElementById('err').style.display='grid'; throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.autoClear=false;
const cam=new THREE.OrthographicCamera(-WW/2,WW/2,WH/2,-WH/2,.1,50); cam.position.z=10;
const qcam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const under=new THREE.Scene(), surf=new THREE.Scene(), comp=new THREE.Scene(), simScene=new THREE.Scene();
for(const s of [under,surf]){
  s.add(new THREE.HemisphereLight(0xfff8ee,0xa9a28c,1.15));
  const d=new THREE.DirectionalLight(0xfff3e0,1.9); d.position.set(-4,5,9); s.add(d);   // light from upper-left
}
const BED_Z=-1.25, SURF_Z=0;

/* ═════════════ 2. water: fine GPU field for the picture, coarse CPU field for floating things ═════════════ */
const quadGeo=new THREE.PlaneGeometry(2,2);
const MAXD=16;
const simMat=new THREE.ShaderMaterial({
  uniforms:{tS:{value:null},tx:{value:new THREE.Vector2()},damp:{value:.988},drops:{value:Array.from({length:MAXD},()=>new THREE.Vector4())},nd:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
    uniform sampler2D tS;uniform vec2 tx;uniform float damp;uniform vec4 drops[${MAXD}];uniform int nd;varying vec2 vUv;
    void main(){
      vec4 s=texture2D(tS,vUv);
      float l=texture2D(tS,vUv-vec2(tx.x,0.)).r,r=texture2D(tS,vUv+vec2(tx.x,0.)).r,
            d=texture2D(tS,vUv-vec2(0.,tx.y)).r,u=texture2D(tS,vUv+vec2(0.,tx.y)).r;
      float h=((l+r+d+u)*.5-s.g)*damp;
      for(int i=0;i<${MAXD};i++){ if(i>=nd) break; vec2 dd=(vUv-drops[i].xy)*vec2(${ASP.toFixed(4)},1.); h+=drops[i].w*exp(-dot(dd,dd)/(drops[i].z*drops[i].z)); }
      float edge=min(min(vUv.x,1.-vUv.x)*3.,min(vUv.y,1.-vUv.y)); h*=mix(.9,1.,smoothstep(0.,.03,edge));
      gl_FragColor=vec4(h,s.r,0.,1.);
    }`
});
simScene.add(new THREE.Mesh(quadGeo,simMat));
const gpuW={a:null,b:null,w:0,h:0,queue:[],
  init(cssW){ this.w=clamp(Math.round(cssW/1.7),300,920); this.h=Math.round(this.w/ASP);
    for(const k of ['a','b']){ if(this[k]) this[k].dispose();
      this[k]=new THREE.WebGLRenderTarget(this.w,this.h,{type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false});
      renderer.setRenderTarget(this[k]); renderer.setClearColor(0x000000,1); renderer.clear(); }
    renderer.setRenderTarget(null); simMat.uniforms.tx.value.set(1/this.w,1/this.h); },
  step(){
    const n=Math.min(MAXD,this.queue.length);
    for(let i=0;i<n;i++){const q=this.queue[i]; simMat.uniforms.drops.value[i].set(q.x/WW+.5,q.y/WH+.5,q.r/WH,q.a);}
    simMat.uniforms.nd.value=n; this.queue.splice(0,n);
    simMat.uniforms.tS.value=this.a.texture; renderer.setRenderTarget(this.b); renderer.render(simScene,qcam);
    const t=this.a; this.a=this.b; this.b=t;
  }
};
const cpuW={gw:Math.round(WW*10),gh:50,a:new Float32Array(Math.round(WW*10)*50),b:new Float32Array(Math.round(WW*10)*50),
  step(){const g=this.gw,A=this.a,B=this.b;
    for(let y=1;y<this.gh-1;y++)for(let x=1;x<g-1;x++){const i=y*g+x; B[i]=((A[i-1]+A[i+1]+A[i-g]+A[i+g])*.5-B[i])*.95;}
    this.a=B; this.b=A;},
  drop(x,y,r,a){const gx=(x/WW+.5)*(this.gw-1),gy=(y/WH+.5)*(this.gh-1),rg=Math.max(1,r*10);
    for(let yy=Math.max(1,Math.floor(gy-rg*2));yy<=Math.min(this.gh-2,Math.ceil(gy+rg*2));yy++)
      for(let xx=Math.max(1,Math.floor(gx-rg*2));xx<=Math.min(this.gw-2,Math.ceil(gx+rg*2));xx++)
        this.a[yy*this.gw+xx]+=a*Math.exp(-((xx-gx)**2+(yy-gy)**2)/(rg*rg));},
  h(x,y){const gx=clamp((x/WW+.5)*(this.gw-1),0,this.gw-1.001),gy=clamp((y/WH+.5)*(this.gh-1),0,this.gh-1.001),ix=Math.floor(gx),iy=Math.floor(gy),fx=gx-ix,fy=gy-iy,g=this.gw,i=iy*g+ix,a=this.a;
    return lerp(lerp(a[i],a[i+1],fx),lerp(a[i+g],a[i+g+1],fx),fy);},
  grad(x,y){const e=.1;return[(this.h(x+e,y)-this.h(x-e,y))/(2*e),(this.h(x,y+e)-this.h(x,y-e))/(2*e)];}
};
function splash(x,y,r,a){ if(gpuW.queue.length>48) gpuW.queue.shift(); gpuW.queue.push({x,y,r,a}); cpuW.drop(x,y,r,a*1.6); }

/* ═════════════ 3. pond bed: rice paper painted per pixel on the GPU (no upscaled texture) ═════════════ */
const GLSL_NOISE=`
  float hs(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
  float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
    return mix(mix(hs(i),hs(i+vec2(1,0)),u.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),u.x),u.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s;}`;
const bed=new THREE.Mesh(new THREE.PlaneGeometry(WW,WH),new THREE.ShaderMaterial({
  uniforms:{seed:{value:new THREE.Vector2(rand(0,90),rand(0,90))}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec2 seed;varying vec2 vUv;${GLSL_NOISE}
    void main(){
      vec2 p=vUv*vec2(${WW.toFixed(4)},5.)+seed;
      vec2 q=p*.3; vec2 w=vec2(fbm(q+3.1),fbm(q+7.7));
      float m1=fbm(q+w*1.7), m2=fbm(q*1.35+w.yx*1.3+11.);
      float wash1=smoothstep(.5,.7,m1), wash2=smoothstep(.54,.74,m2);
      float rim=smoothstep(.49,.515,m1)-smoothstep(.515,.58,m1);           // ink gathers at the wash edge
      vec3 c=vec3(.953,.933,.888);
      c=mix(c,vec3(.80,.87,.75),wash1*.5);
      c=mix(c,vec3(.75,.85,.83),wash2*.42);
      c-=vec3(.06,.05,.07)*rim*.55;
      float fib=vn(vec2(p.x*55.,p.y*4.)+fbm(p*2.1)*5.); c-=(fib-.5)*.02;      // paper fibres
      c+=(hs(gl_FragCoord.xy)-.5)*.012;                                       // fine grain, kills banding
      vec2 e=vUv-.5; float vig=smoothstep(.22,.72,length(e*vec2(1.,1.5)));
      c=mix(c,c*vec3(.86,.9,.83),vig*.55);
      gl_FragColor=vec4(pow(c,vec3(2.2)),1.);
    }`}));
bed.position.z=BED_Z; bed.renderOrder=0; under.add(bed);

/* ═════════════ 4. composite: refraction, caustics, glints from the fine field ═════════════ */
let underRT;
const compMat=new THREE.ShaderMaterial({
  uniforms:{tScene:{value:null},tW:{value:null},wT:{value:new THREE.Vector2()},uNs:{value:26},uRefr:{value:.016},uCaus:{value:9}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
    uniform sampler2D tScene,tW;uniform vec2 wT;uniform float uNs,uRefr,uCaus;varying vec2 vUv;
    float H(vec2 o){return texture2D(tW,vUv+o*wT).r;}
    void main(){
      float gx=(H(vec2(1,-1))+2.*H(vec2(1,0))+H(vec2(1,1)))-(H(vec2(-1,-1))+2.*H(vec2(-1,0))+H(vec2(-1,1)));
      float gy=(H(vec2(-1,1))+2.*H(vec2(0,1))+H(vec2(1,1)))-(H(vec2(-1,-1))+2.*H(vec2(0,-1))+H(vec2(1,-1)));
      vec2 g=vec2(gx,gy)/8.;
      vec3 n=normalize(vec3(-g*uNs,1.));
      vec3 c=texture2D(tScene,clamp(vUv+n.xy*uRefr,.001,.999)).rgb;
      float lap=H(vec2(2,0))+H(vec2(-2,0))+H(vec2(0,2))+H(vec2(0,-2))-4.*H(vec2(0));
      c+=vec3(1.,.96,.85)*clamp(-lap*uCaus,0.,1.)*.28;
      c*=1.-clamp(lap*uCaus,0.,1.)*.08;
      vec3 L=normalize(vec3(-.45,.55,1.)); vec3 Rf=reflect(-L,n);
      c+=vec3(1.,.98,.93)*pow(max(Rf.z,0.),160.)*1.2*smoothstep(.002,.02,length(g));
      gl_FragColor=vec4(c,1.);
      #include <colorspace_fragment>
    }`,depthTest:false,depthWrite:false});
comp.add(new THREE.Mesh(quadGeo,compMat));

/* ═════════════ 5. painting kit: textures are painted, not assembled from shapes ═════════════ */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d',{willReadFrequently:true});return c;}   // CPU canvases: painted once, read back for relief maps
function pixels(w,h,fn){const c=cv(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const o=fn(x,y),i=(y*w+x)*4;d[i]=o[0];d[i+1]=o[1];d[i+2]=o[2];d[i+3]=o[3];}
  g.putImageData(im,0,0);return c;}
function normalFrom(hc,strength){const w=hc.width,h=hc.height,src=hc.getContext('2d').getImageData(0,0,w,h).data;
  const H=(x,y)=>src[((clamp(y,0,h-1))*w+clamp(x,0,w-1))*4]/255;
  return pixels(w,h,(x,y)=>{const dx=(H(x+1,y-1)+2*H(x+1,y)+H(x+1,y+1)-H(x-1,y-1)-2*H(x-1,y)-H(x-1,y+1))*strength,
    dy=(H(x-1,y+1)+2*H(x,y+1)+H(x+1,y+1)-H(x-1,y-1)-2*H(x,y-1)-H(x+1,y-1))*strength,l=Math.hypot(dx,dy,1);
    return[(-dx/l*.5+.5)*255,(dy/l*.5+.5)*255,(1/l*.5+.5)*255,255];});}
function tex(c,srgb=true){const t=new THREE.CanvasTexture(c);t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.generateMipmaps=true;t.minFilter=THREE.LinearMipmapLinearFilter;return t;}
function softShadow(src,scale){const s=cv(Math.max(8,src.width/scale|0),Math.max(8,src.height/scale|0)),g=s.getContext('2d');
  g.drawImage(src,0,0,s.width,s.height); const o=cv(src.width/2,src.height/2),h=o.getContext('2d'); h.imageSmoothingQuality='high';
  h.drawImage(s,0,0,o.width,o.height); return o;}

/* ─── goldfish: six fish drawn after Ben's reference — each variety sets the body colouring, the head growth and every fin's colouring ─── */
// body: base colour field + pattern; wen: colour of the head growth; fin: palette each fin draws its own variation from
const VARIETY={
  redwhite:{pattern:'patches',base:[248,243,236],red:[[218,40,14],[242,82,32]],wen:[[216,56,26],[248,140,80]],
    fin:{root:[[218,46,18],[234,70,30]],mid:[[240,122,92],[246,150,120]],edge:[[236,234,236],[222,222,228]],rootLen:[.45,.75],streak:.45,a:[.96,.58]}},
  black:{pattern:'black',base:[26,24,25],red:[[26,24,25],[26,24,25]],wen:[[40,36,36],[70,62,58]],
    fin:{root:[[22,20,20],[30,26,24]],mid:[[44,42,44],[56,54,58]],edge:[[96,96,104],[120,120,128]],rootLen:[.3,.55],streak:.35,a:[.96,.6],
      fleck:{col:[214,156,60],amount:.55,reach:.45}}},
  red:{pattern:'red',base:[232,60,24],red:[[220,40,14],[244,86,34]],wen:[[226,62,26],[250,126,66]],
    fin:{root:[[226,52,20],[240,78,34]],mid:[[244,112,74],[248,138,100]],edge:[[232,226,226],[214,212,220]],rootLen:[.7,.95],streak:.4,a:[.97,.6]}},
  tancho:{pattern:'tancho',base:[248,244,238],red:[[214,52,26],[236,92,52]],wen:[[212,44,26],[240,98,64]],
    fin:{root:[[226,74,46],[236,104,74]],mid:[[244,226,222],[248,236,232]],edge:[[232,232,236],[220,220,228]],rootLen:[.15,.35],streak:.5,a:[.92,.5]}},
  yellow:{pattern:'yellow',base:[250,246,238],red:[[244,170,40],[250,200,70]],wen:[[242,166,24],[255,214,90]],
    fin:{root:[[250,196,60],[246,150,36]],mid:[[252,214,150],[250,230,190]],edge:[[240,238,236],[226,226,230]],rootLen:[.45,.7],streak:.55,a:[.95,.58]}},
  calico:{pattern:'calico',base:[232,234,238],red:[[226,94,40],[244,140,70]],wen:[[230,110,60],[246,150,90]],
    fin:{root:[[226,226,232],[214,216,224]],mid:[[226,228,234],[236,236,240]],edge:[[228,230,236],[214,216,224]],rootLen:[.2,.4],streak:.3,a:[.88,.46],
      spots:{dark:[34,30,32],warm:[230,118,52],amount:.5}}}
};
const pickC=pair=>mix3(pair[0],pair[1],R());
function worley(x,y,s){ // nearest jittered cell point: distance, cell id, second distance, offset to that point — raspberry-like nodules
  const ix=Math.floor(x),iy=Math.floor(y);let d1=9,d2=9,id=0,qx=0,qy=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=ix+i,cy=iy+j,px=cx+.15+.7*hash(cx,cy,s),py=cy+.15+.7*hash(cx,cy,s+7),d=Math.hypot(x-px,y-py);
    if(d<d1){d2=d1;d1=d;id=hash(cx,cy,s+13);qx=x-px;qy=y-py;}else if(d<d2)d2=d;}
  return[d1,id,d2,qx,qy];
}
function paintBody(B,seed){
  const V=VARIETY[B.v],TW=640,TH=320,mid=TH/2,s=seed|0,dark=B.v==='black';
  const half=u=>B.shape(u)*mid*.97;
  // head growth: a hood over crown and cheeks, a round red cap on the crown (tancho), or none (bubble-eye)
  const wenAt=(u,v)=>{const n=.05*(fbm(v*3+seed,u*6,s+21)-.5);
    if(B.wen==='cap'){const d=Math.hypot((u-.14)/.13,v/.72)+n*2;return sstep(1,.86,d);}
    if(B.wen>0){const e=B.wen-.1*v*v;return sstep(e,e-.06,u+n);}
    return 0;};
  const col=cv(TW,TH),hc=cv(TW,TH),ci=col.getContext('2d').createImageData(TW,TH),hi=hc.getContext('2d').createImageData(TW,TH),D=ci.data,HD=hi.data;
  for(let y=0;y<TH;y++)for(let x=0;x<TW;x++){const o=(y*TW+x)*4,u=x/TW,hw=half(u)||1e-3,vv=(y-mid)/hw,ax=Math.abs(vv);HD[o+3]=255;
    if(ax>=1.02)continue;
    const t=fbm(u*5+seed,vv*3,s+7),red=mix3(V.red[0],V.red[1],t);let c=V.base.slice();
    switch(V.pattern){
      case 'patches':{const w=fbm(u*2.2+seed,vv*1.4,s+3)*1.1,m=sstep(.44,.52,fbm(u*2.6+w+seed,vv*1.5,s)+.06*(1-ax));c=mix3(c,red,m);
        c=mix3(c,[252,236,214],sstep(.75,1,ax)*.3*(1-m));break;}
      case 'red':c=mix3(red,[250,170,96],sstep(.65,1,ax)*.4);break;
      case 'tancho':{const m=sstep(.6,.66,fbm(u*4+seed,vv*2.4,s));c=mix3(c,red,m*sstep(.3,.4,u));break;}
      case 'yellow':{const side=sstep(.25,.9,ax)+.35*(fbm(u*3+seed,vv*2,s)-.5);c=mix3(c,red,clamp(side,0,1));break;}

/* ═════════════ 9. food ═════════════ */
const food=[], pelletGeo=new THREE.SphereGeometry(.03,12,10), pelletMat=new THREE.MeshStandardMaterial({color:0xa36b38,roughness:.7,transparent:true,depthTest:false,depthWrite:false});
function dropFood(x,y){const n=3+Math.floor(R()*3);
  for(let k=0;k<n;k++){const a=R()*TAU,r=Math.sqrt(R())*.28;
    const f={x:x+Math.cos(a)*r,y:y+Math.sin(a)*r,z:SURF_Z,land:rand(.05,.35),floatT:rand(2,6),sinking:false,life:0,gone:false,m:new THREE.Mesh(pelletGeo,pelletMat)};
    f.m.visible=false;f.m.renderOrder=60;surf.add(f.m);food.push(f);}}
function nearestFood(fi){let b=null,bd=1e9;for(const f of food){if(f.gone||f.land>0)continue;const d=Math.hypot(f.x-fi.x,f.y-fi.y);if(d<bd){bd=d;b=f;}}return b;}
function eatFood(f,fi){f.gone=true;f.m.parent&&f.m.parent.remove(f.m);splash(f.x,f.y,.05,.035);fi.pause=rand(.3,.8);fi.target=null;}
function stepFood(dt){for(let k=food.length-1;k>=0;k--){const f=food[k];if(f.gone){food.splice(k,1);continue;}
  if(f.land>0){if((f.land-=dt)<=0){f.m.visible=true;splash(f.x,f.y,.045,.05);}continue;}
  f.life+=dt;const [gx,gy]=cpuW.grad(f.x,f.y);
  if(!f.sinking){f.x-=gx*.35*dt;f.y-=gy*.35*dt;f.m.position.set(f.x,f.y,SURF_Z+cpuW.h(f.x,f.y)*.4+.01);if((f.floatT-=dt)<=0){f.sinking=true;surf.remove(f.m);f.m.renderOrder=850;under.add(f.m);}}
  else{f.z=Math.max(BED_Z+.05,f.z-dt*rand(.04,.07));f.x-=gx*.06*dt;f.y-=gy*.06*dt;f.m.position.set(f.x,f.y,f.z);}
  if(f.life>28){f.gone=true;f.m.parent&&f.m.parent.remove(f.m);}}}

/* ═════════════ 10. plants ═════════════ */
const clumps=[], lettuces=[], pads=[], fronds=[]; let frondMeshes=[];
const HAZE=[.62,.74,.72];                      // colour a leaf takes on where it is deep in the water
/* A rooted plant: every leaf grows from its own spot on the bed and follows its own gently wandering line.
   Near the bed a leaf is still rising, so from above it is short, faded and hazy; further out it lies over

/* ═════════════ 11. sizing ═════════════ */
let cssW=0,cssH=0;
function resize(){
  const w=Math.round(stage.clientWidth),h=INSPECT?Math.round(w/1.6):Math.round(stage.clientHeight); if(!w||!h||(w===cssW&&h===cssH)) return;
  // the box was dragged to a clearly different shape: rebuild the pond for it (layout, plants and water all follow the shape)
  if(!INSPECT&&Math.abs(Math.min(8,Math.max(1.5,w/h))/ASP-1)>.04){clearTimeout(resize.t);resize.t=setTimeout(()=>location.reload(),500);return;}
  cssW=w;cssH=h; renderer.setSize(w,h,false);
  const pr=renderer.getPixelRatio();
  if(underRT) underRT.dispose();
  underRT=new THREE.WebGLRenderTarget(Math.round(w*pr),Math.round(h*pr),{type:THREE.HalfFloatType,samples:4});
  gpuW.init(w); compMat.uniforms.tScene.value=underRT.texture; compMat.uniforms.wT.value.set(1/gpuW.w,1/gpuW.h);
}
new ResizeObserver(resize).observe(stage); resize();

/* ═════════════ 12. build the pond ═════════════ */
buildPlants();
// each fish takes a moment to paint, so they are added one per frame and the pond starts moving at once
const order=[]; let orderT=0;
FISH.slice().sort(()=>R()-.5).forEach((spec,k)=>setTimeout(()=>{const f=new Fish(spec,FISH.indexOf(spec));f.step(DT);fishes.push(f);order.push(f);
  order.forEach((g,i)=>g.setRank(i));painterize(under);},60+k*30));
function apart(a,b){let m=1e9;for(let i=0;i<NB;i+=4)for(let j=0;j<NB;j+=4)m=Math.min(m,Math.hypot(a.rn[i][0]-b.rn[j][0],a.rn[i][1]-b.rn[j][1]));
  return m>a.B.Wm+b.B.Wm+Math.max(a.B.tail.len,b.B.tail.len)+.15;}
function reorder(dt){ // a whole fish is above or below another; a pair may change places only while they don't touch
  if((orderT-=dt)>0) return; orderT=.25; let ch=false;
  for(let i=0;i<order.length-1;i++){const a=order[i],b=order[i+1]; if(a.z>b.z+.05&&apart(a,b)){order[i]=b;order[i+1]=a;ch=true;}}
  if(ch) order.forEach((f,i)=>f.setRank(i));
}
painterize(under); painterize(surf);

/* ═════════════ 13. input ═════════════ */
canvas.addEventListener('pointerdown',ev=>{
  if(INSPECT) return;
  const r=canvas.getBoundingClientRect(),x=((ev.clientX-r.left)/r.width-.5)*WW,y=(.5-(ev.clientY-r.top)/r.height)*WH;
  const hf=fishes.find(f=>f.hit(x,y));
  if(hf){hf.startle(x,y,1);splash(x,y,.12,.06);
    for(const o of fishes){if(o===hf)continue;const d=Math.hypot(o.x-x,o.y-y);if(d<2.6&&R()<(1-o.pers.bold)*.9*(1-d/2.6)){o.fleeQ=d*.12+rand(0,.25);o.fleeArgs=[x,y,.6+.4*(1-d/2.6)];}}}
  else{splash(x,y,.1,.09);dropFood(x,y);
    for(const o of fishes){const d=Math.hypot(o.x-x,o.y-y);if(d<.8&&R()<(1-o.pers.bold)*.4){o.fleeQ=rand(0,.15);o.fleeArgs=[x,y,.45];}}}
});

/* ═════════════ 14. loop: fixed steps, independent of frame rate ═════════════ */
let plantTick=false,last=performance.now(),acc=0,accW=0,accC=0,time=0,nextDrop=rand(.6,3);
const DT=1/120, FINE_PER_S=120;
/* close-up inspection: open the page with #closeup to follow one goldfish at 3.5× (switches fish every 8 s, floating leaves hidden) */
const CLOSE=location.hash==='#closeup'; let closeI=0,closeT=0,ccx=0,ccy=0;
if(CLOSE) window.__close=i=>{closeI=i;closeT=0;ccx=fishes[i].x;ccy=fishes[i].y;};
function aimCam(dt){ if(!CLOSE||!fishes.length) return; if(closeI>=fishes.length)closeI=0; if((closeT+=dt)>8){closeT=0;closeI=(closeI+1)%fishes.length;ccx=fishes[closeI].x;ccy=fishes[closeI].y;}
  const f=fishes[closeI],z=3.5,hw=WW/2/z,hh=WH/2/z; const mx=(f.x+f.rn[NB-1][0])/2,my=(f.y+f.rn[NB-1][1])/2;ccx+=(mx-ccx)*Math.min(1,dt*6); ccy+=(my-ccy)*Math.min(1,dt*6);
  cam.left=ccx-hw;cam.right=ccx+hw;cam.top=ccy+hh;cam.bottom=ccy-hh;cam.updateProjectionMatrix();}
/* ═════════════ 15. #inspect: one goldfish alone, turned freely through 360° ═════════════ */
const insp={name:FISH[0].name,az:2.3,el:.75,dist:3.1,paused:false,stepN:0,mode:'free'};
const pcam=new THREE.PerspectiveCamera(32,1.6,.01,60); const inspScene=new THREE.Scene();
function inspFish(){return fishes.find(f=>f.B.name===insp.name);}
const VIEWS=[['俯視',0,1.5699],['側視',Math.PI/2,.06],['斜上 45°',2.3,.785],['後方',Math.PI,.2],['正下方',0,-1.5699]];
function renderInspect(){
  renderer.setRenderTarget(null);renderer.setClearColor(0xf3eee3,1);renderer.clear();
  const f=inspFish();if(!f)return;
  const i=NB-1,tg=new THREE.Vector3(f.rn[i][0],f.rn[i][1],f.z+f.B.hb*.4),h=f.hd+Math.PI+insp.az,ce=Math.cos(insp.el);
  pcam.position.set(tg.x+insp.dist*ce*Math.cos(h),tg.y+insp.dist*ce*Math.sin(h),tg.z+insp.dist*Math.sin(insp.el));
  if(Math.abs(insp.el)>1.5)pcam.up.set(Math.cos(f.hd),Math.sin(f.hd),0);else pcam.up.set(0,0,1);
  pcam.lookAt(tg);pcam.aspect=cssW/cssH;pcam.updateProjectionMatrix();
  // borrow this fish (and the lights) into a scene of its own, draw it with real depth, then hand everything back
  const keep=[f.body.mesh,f.belly.mesh,...f.fins.map(l=>l.mesh),...f.parts,...under.children.filter(o=>o.isLight)],ro=keep.map(o=>o.renderOrder);
  keep.forEach(o=>{inspScene.add(o);o.renderOrder=0;if(o.material){o.material.depthTest=true;o.material.depthWrite=o===f.body.mesh||o===f.belly.mesh||!!o.userData.solid;}});
  renderer.render(inspScene,pcam);
  keep.forEach((o,k)=>{under.add(o);o.renderOrder=ro[k];if(o.material){o.material.depthTest=false;o.material.depthWrite=false;}});
  read.textContent=`方位 ${Math.round(((insp.az*57.3)%360+360)%360)}°　仰角 ${Math.round(insp.el*57.3)}°`;
}
let read={};
if(INSPECT){
  const cap=document.getElementById('cap');cap.textContent='拖曳畫面可 360° 旋轉，滾輪縮放';
  const box=document.createElement('div');box.id='insp';cap.after(box);
  const group=(label,items,isOn,onClick)=>{const g=document.createElement('div');g.className='grp';g.innerHTML=`<span class="lab">${label}</span>`;
    const bs=items.map((it,k)=>{const b=document.createElement('button');b.type='button';b.textContent=it;b.onclick=()=>{onClick(k);bs.forEach((x,j)=>x.setAttribute('aria-pressed',isOn(j)));};
      b.setAttribute('aria-pressed',isOn(k));g.append(b);return b;});box.append(g);return bs;};
  group('金魚',FISH.map(f=>f.name),k=>FISH[k].name===insp.name,k=>insp.name=FISH[k].name);
  group('角度',VIEWS.map(v=>v[0]),()=>false,k=>{insp.az=VIEWS[k][1];insp.el=VIEWS[k][2];});
  const modes=['free','rest','swim'];group('動作',['自由游','停下','游動'],k=>insp.mode===modes[k],k=>insp.mode=modes[k]);
  const pb=group('播放',['暫停','逐格'],k=>k===0&&insp.paused,k=>{if(k===0){insp.paused=!insp.paused;pb[0].textContent=insp.paused?'繼續':'暫停';}else{insp.paused=true;insp.stepN+=4;pb[0].textContent='繼續';}});
  read=document.createElement('span');read.className='read';box.append(read);
  let drag=null;
  canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,insp.az,insp.el];canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!drag)return;insp.az=drag[2]-(e.clientX-drag[0])*.008;insp.el=clamp(drag[3]+(e.clientY-drag[1])*.008,-1.5699,1.5699);});
  canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
  canvas.addEventListener('wheel',e=>{e.preventDefault();insp.dist=clamp(insp.dist*Math.exp(e.deltaY*.001),.8,6);},{passive:false});
}
let onScreen=true; new IntersectionObserver(e=>{onScreen=e[0].isIntersecting;}).observe(stage);
function frame(now){
  requestAnimationFrame(frame);
  if(!underRT||!onScreen||document.hidden){last=now;return;}   // nothing to draw while the banner is out of sight
  const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt;
  if((nextDrop-=dt)<=0){splash(rand(-.48,.48)*WW,rand(-.46,.46)*WH,rand(.03,.06),rand(.008,.02));nextDrop=rand(.5,4);}
  acc+=dt; while(acc>=DT){
    if(INSPECT){const f=inspFish();if(f&&insp.mode!=='free')Object.assign(f,insp.mode==='rest'?{state:'idle',stT:99,mode:'coast',mdT:99,effT:.05,fT:.8}:{state:'cruise',stT:99,mode:'burst',mdT:99,effT:1,fT:1.8});}
    if(!INSPECT||!insp.paused||insp.stepN>0){for(const f of fishes)f.step(DT); if(INSPECT&&insp.stepN>0)insp.stepN--;}
    if((plantTick=!plantTick))stepPlants(DT*2,time); stepFood(DT); acc-=DT;}
  accW+=dt*FINE_PER_S; let n=0; while(accW>=1&&n<4){gpuW.step();accW-=1;n++; accC+=(WW/gpuW.w)/(WW/cpuW.gw)*1.0;} if(accW>4)accW=0;
  while(accC>=1){cpuW.step();accC-=1;}
  reorder(dt);
  for(const f of fishes)f.draw(); drawPlants();
  compMat.uniforms.tW.value=gpuW.a.texture;
  aimCam(dt);
  if(INSPECT){renderInspect();return;}
  renderer.setRenderTarget(underRT); renderer.setClearColor(0xf2ede1,1); renderer.clear(); renderer.render(under,cam);
  renderer.setRenderTarget(null); renderer.clear(); renderer.render(comp,qcam);
  renderer.clearDepth(); if(!CLOSE) renderer.render(surf,cam);   // close-up hides floating leaves so the fish can be inspected
}
requestAnimationFrame(frame);
</script>
