<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar</title>
<style>
  :root{--bg:#F7F6F3;--head:#9A9384;--headText:#FFFFFF;--text:#55534E;--dim:#D3D1CB;--today:#9A9384;--todayText:#FFFFFF}
  @media (prefers-color-scheme: dark){:root{--bg:#262523;--head:#6E685E;--headText:#F1EEE8;--text:#D6D3CD;--dim:#55524C;--today:#B3AA99;--todayText:#1E1D1B}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .cal{width:100%;background:var(--bg)}
  .top{display:flex;align-items:center;justify-content:space-between;background:var(--head);color:var(--headText);padding:12px 14px;font-size:15px;font-weight:600}
  .top button{background:none;border:0;color:var(--headText);font-size:18px;cursor:pointer;width:28px;height:28px;border-radius:6px}
  .top button:hover{background:rgba(255,255,255,.15)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);padding:10px 10px 12px;row-gap:4px}
  .wd{text-align:center;font-size:12px;color:var(--text);font-weight:600;padding:6px 0}
  .d{text-align:center;font-size:13px;color:var(--text);padding:8px 0;border-radius:6px}
  .d.o{color:var(--dim)}
  .d.t{background:var(--today);color:var(--todayText);font-weight:700}
</style>
</head>
<body>
<div class="cal">
  <div class="top"><button id="p" aria-label="Previous month">&#8249;</button><span id="m"></span><button id="n" aria-label="Next month">&#8250;</button></div>
  <div class="grid" id="g"></div>
</div>
<script>
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var WD=["M","T","W","T","F","S","S"];
function taipeiNow(){var s=new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"});return new Date(s);}
var now=taipeiNow(), y=now.getFullYear(), mo=now.getMonth();
function draw(){
  var g=document.getElementById('g');g.innerHTML='';
  document.getElementById('m').textContent=MONTHS[mo]+' '+y;
  WD.forEach(function(w){var e=document.createElement('div');e.className='wd';e.textContent=w;g.appendChild(e);});
  var first=new Date(y,mo,1), lead=(first.getDay()+6)%7, days=new Date(y,mo+1,0).getDate(), prevDays=new Date(y,mo,0).getDate();
  var t=taipeiNow();
  for(var i=0;i<42;i++){
    var e=document.createElement('div');e.className='d';var num;
    if(i<lead){num=prevDays-lead+i+1;e.className+=' o';}
    else if(i>=lead+days){num=i-lead-days+1;e.className+=' o';}
    else{num=i-lead+1;if(num===t.getDate()&&mo===t.getMonth()&&y===t.getFullYear())e.className+=' t';}
    e.textContent=num;g.appendChild(e);
  }
}
document.getElementById('p').onclick=function(){mo--;if(mo<0){mo=11;y--;}draw();};
document.getElementById('n').onclick=function(){mo++;if(mo>11){mo=0;y++;}draw();};
draw();
setInterval(function(){var t=taipeiNow();if(t.getDate()!==now.getDate()){now=t;draw();}},60000);
</script>
</body>
</html>
