<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人生路線圖</title>
<style>
/* Layout: goal rings on top; below them one wide sheet that slides sideways — track rows above
   the axis, the axis (cakes, flags and today on one line), track rows below it, then one column
   of cards per year (six years in view).
   Look: Ben's Notion homepage — warm paper, soft brown ink, muted goal colors. */
:root {
  --bg: #f7f6f3;
  --card: #ffffff;
  --ink: #37352f;
  --text: #55534e;
  --soft: #8f897d;
  --line: #dcd8d0;
  --line-strong: #c9c3b8;
  --brown: #976d57;
  --hover: #edeae4;
  --done: #6e8b5e;
  --warn: #b5651d;
  --shade: rgb(55 53 47 / 0.28);
  --lift: 0 1px 2px rgb(55 53 47 / 0.06), 0 6px 18px rgb(55 53 47 / 0.08);
  --p-clay: #c49a80;
  --p-slate: #7e8fa6;
  --p-olive: #8c9a6e;
  --p-rose: #c48e8e;
  --p-teal: #6f9a97;
  --p-ochre: #c7a55a;
  --p-plum: #9a7fa0;
  --p-moss: #5f8a73;
  --p-dusk: #8a8f9c;
  --p-sand: #bfae8e;
  --cake: #f3e3d3;
  --cake-icing: #e9b8b0;
  --candle: #8fb3c9;
  --flame: #f2b84b;
  --gold: #d4a64a;
  --now-band: rgb(151 109 87 / 0.045);
  --serif: "Noto Serif TC", Georgia, "Times New Roman", serif;
  --sans: -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", Helvetica, Arial, sans-serif;
  --fs-xs: 0.6875rem;
  --fs-s: 0.78125rem;
  --fs-m: 0.875rem;
  --fs-l: 1rem;
  --fs-xl: 1.375rem;
  --radius: 8px;
  --gap: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1e1b;
    --card: #2a2925;
    --ink: #ece9e3;
    --text: #c9c5bc;
    --soft: #948e82;
    --line: #3d3b36;
    --line-strong: #57534b;
    --brown: #c9a088;
    --hover: #33312c;
    --done: #93b383;
    --warn: #e09455;
    --shade: rgb(0 0 0 / 0.5);
    --lift: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 18px rgb(0 0 0 / 0.35);
    --cake: #5a4a40;
    --cake-icing: #b98a84;
    --candle: #7d9fb4;
    --flame: #f5c25e;
    --gold: #e0b45a;
    --now-band: rgb(201 160 136 / 0.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1e1b;
  --card: #2a2925;
  --ink: #ece9e3;
  --text: #c9c5bc;
  --soft: #948e82;
  --line: #3d3b36;
  --line-strong: #57534b;
  --brown: #c9a088;
  --hover: #33312c;
  --done: #93b383;
  --warn: #e09455;
  --shade: rgb(0 0 0 / 0.5);
  --lift: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 18px rgb(0 0 0 / 0.35);
  --cake: #5a4a40;
  --cake-icing: #b98a84;
  --candle: #7d9fb4;
  --flame: #f5c25e;
  --gold: #e0b45a;
  --now-band: rgb(201 160 136 / 0.06);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  overflow-x: hidden;
}
button {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--brown);
  outline-offset: 2px;
}
.ico {
  width: 1.1em;
  height: 1.1em;
  flex: none;
}

#roadmap {
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.loading,
.empty {
  color: var(--soft);
  font-size: var(--fs-m);
  margin: 0;
}
.notice {
  margin: 0;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: var(--hover);
  font-size: var(--fs-s);
  color: var(--text);
}
.notice.is-bad {
  color: var(--warn);
}

/* Goals: four in view, slide for more. */
.goals {
  position: relative;
}
.goals-scroll {
  --cols: 4;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));
  gap: var(--gap);
  overflow-x: auto;
  scrollbar-width: none;
  padding-right: 44px;
}
.goals-scroll::-webkit-scrollbar,
.board::-webkit-scrollbar {
  display: none;
}
@media (max-width: 760px) {
  .goals-scroll {
    --cols: 2;
  }
}
.goal {
  all: unset;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 6px 8px;
  border-radius: var(--radius);
  cursor: pointer;
}
.goal:hover {
  background: var(--hover);
}
.goal:focus-visible {
  outline: 2px solid var(--brown);
}
.ring {
  width: 60px;
  height: 60px;
  flex: none;
}
.ring-track {
  stroke: var(--line);
}
.ring-num {
  text-anchor: middle;
  font-family: var(--serif);
  font-size: 14px;
  fill: var(--ink);
}
.goal-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.goal-title {
  font-weight: 600;
  font-size: var(--fs-m);
  overflow-wrap: anywhere;
}
.goal-sub {
  font-size: var(--fs-s);
  color: var(--text);
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
}
.goal .late {
  color: var(--warn);
}
.goal .reached {
  color: var(--done);
  font-weight: 600;
}
.add-goal {
  position: absolute;
  right: 0;
  top: 50%;
  translate: 0 -50%;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--card);
  color: var(--brown);
  cursor: pointer;
  box-shadow: var(--lift);
}
@media (prefers-reduced-motion: no-preference) {
  .arc {
    transition: stroke-dasharray 0.8s ease;
  }
}

/* The sliding sheet. */
.board {
  overflow-x: auto;
  scrollbar-width: none;
  cursor: grab;
  margin-inline: -4px;
  /* Soft edges hint that the sheet goes on to both sides. */
  mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent);
}
.board.is-dragging {
  cursor: grabbing;
  user-select: none;
}
.board.is-dragging * {
  pointer-events: none;
}
.board-inner {
  position: relative;
}
.lanes {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.lane {
  position: relative;
  display: flex;
  transition: background 0.15s;
}
.lane.is-moving {
  z-index: 5;
  background: var(--hover);
  opacity: 0.9;
}
.lane-body {
  position: relative;
  flex: 0 0 100%;
}
.lane-track .lane-body {
  min-height: 26px;
}
/* The handle stays at the left edge of the screen while the sheet slides. */
.grip {
  position: sticky;
  left: 0;
  z-index: 4;
  flex: 0 0 26px;
  margin-right: -26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 6px;
  background: var(--bg);
  color: var(--soft);
  cursor: grab;
  touch-action: none;
}
.drop-line {
  position: absolute;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--brown);
  z-index: 6;
  pointer-events: none;
}

.segment {
  position: absolute;
  height: 22px;
  border: 0;
  border-radius: 11px;
  padding: 0 10px;
  background: color-mix(in srgb, var(--c) 28%, var(--card));
  color: var(--ink);
  font-size: var(--fs-xs);
  text-align: left;
  overflow: hidden;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: inset 3px 0 0 var(--c);
  display: flex;
  align-items: center;
  gap: 10px;
}
/* The name gives way first; the dates stay whole at the right end while they fit. */
.segment-name {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.segment-range {
  flex: 0 0 auto;
  color: var(--soft);
  font-variant-numeric: tabular-nums;
}
.segment:hover {
  background: color-mix(in srgb, var(--c) 42%, var(--card));
}
.track-name {
  position: sticky;
  left: 30px;
  z-index: 3;
  display: inline-block;
  height: 16px;
  margin: 0;
  padding: 0 8px;
  line-height: 16px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--soft);
  font-size: var(--fs-xs);
  letter-spacing: 0.06em;
  cursor: pointer;
}
.track-name:hover {
  color: var(--brown);
}

/* The axis: one band. Bottom up: year labels, the line (past solid, future dashed), then cakes
   standing on the line and flags planted in it. Positions are measured from the bottom, so a
   band with lifted flags grows upward. */
.axis {
  --line-y: 30px;
  position: relative;
  height: 94px;
}
.axis-now-band {
  position: absolute;
  top: 0;
  bottom: 0;
  background: var(--now-band);
  border-radius: 10px;
  pointer-events: none;
}
.axis-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(var(--line-y) - 8px);
  height: 16px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: copy;
}
/* The future: a soft dashed line. */
.axis-line::before {
  content: "";
  position: absolute;
  inset: 7px 0 auto;
  height: 2px;
  background: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 11px);
}
/* Month ticks show only while the pointer is on the line. */
.axis-line::after {
  content: "";
  position: absolute;
  inset: 4px 0 auto;
  height: 8px;
  opacity: 0;
  transition: opacity 0.15s;
  background: repeating-linear-gradient(
    90deg,
    var(--line-strong) 0 1px,
    transparent 1px var(--month)
  );
}
.axis-line:hover::after {
  opacity: 0.7;
}
.axis-past {
  position: absolute;
  left: 0;
  top: 6px;
  height: 4px;
  border-radius: 2px;
  background: var(--brown);
}
.axis-years {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 20px;
  pointer-events: none;
}
.axis-year {
  position: absolute;
  bottom: 0;
  text-align: center;
  font-family: var(--serif);
  font-size: var(--fs-m);
  color: var(--soft);
  letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
}
.axis-year::before {
  content: "";
  position: absolute;
  left: 0;
  bottom: 22px;
  width: 1px;
  height: 12px;
  background: var(--line-strong);
}
.axis-year.is-now {
  color: var(--brown);
  font-weight: 600;
}

/* Birthday cakes stand on the line; the candle flickers and smoke carries the age upward. */
.cake-mark {
  position: absolute;
  bottom: calc(var(--line-y) + 1px);
  translate: -50% 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: auto;
}
.cake {
  width: 24px;
  height: 26px;
  display: block;
}
.cake-base {
  fill: var(--cake);
}
.cake-top {
  fill: var(--cake-icing);
}
.cake-drip {
  fill: none;
  stroke: var(--cake-icing);
  stroke-width: 1.6;
  stroke-linecap: round;
}
.cake-candle {
  fill: var(--candle);
}
.cake-flame {
  fill: var(--flame);
  transform-origin: 14px 7px;
}
.cake-mark.is-round .cake {
  width: 30px;
  height: 32px;
}
.cake-mark.is-round .cake-base {
  fill: var(--gold);
}
.cake-mark.is-round .cake-top {
  fill: color-mix(in srgb, var(--gold) 45%, var(--card));
}
.cake-mark.is-round .cake-drip {
  stroke: color-mix(in srgb, var(--gold) 45%, var(--card));
}
.smoke {
  position: absolute;
  bottom: 100%;
  font-family: var(--serif);
  font-size: var(--fs-xs);
  color: var(--soft);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.cake-mark.is-round .smoke {
  color: var(--gold);
  font-weight: 600;
}

/* Flags: planted in the line at the goal's date; the cloth waves. Pale until reached. */
.flag-mark {
  /* --pole is set per flag by the layout (core/marks.ts), clear of cakes and other labels. */
  position: absolute;
  bottom: calc(var(--line-y) - 1px);
  width: 28px;
  height: var(--pole);
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  z-index: 2;
}
.flag-pole {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 2px;
  height: 100%;
  border-radius: 1px;
  background: var(--ink);
  opacity: 0.75;
}
.flag-cloth {
  position: absolute;
  left: 2px;
  top: 0;
  width: 26px;
  height: 18px;
  overflow: visible;
  transform-origin: 0 50%;
}
.flag-cloth path {
  fill: color-mix(in srgb, var(--c) 32%, var(--card));
  stroke: color-mix(in srgb, var(--c) 60%, var(--card));
  stroke-width: 0.8;
}
.flag-mark.is-reached .flag-cloth path {
  fill: var(--c);
  stroke: var(--c);
}
.flag-text {
  position: absolute;
  left: 32px;
  top: -2px;
  display: flex;
  flex-direction: column;
  font-size: var(--fs-xs);
  color: var(--soft);
  white-space: nowrap;
  line-height: 1.35;
}
.flag-text b {
  color: var(--ink);
  font-size: var(--fs-s);
}
/* Label on the left when the right side is taken: cloth mirrored, text right-aligned. */
.flag-mark.is-left .flag-cloth {
  left: auto;
  right: 26px;
  transform-origin: 100% 50%;
  scale: -1 1;
}
.flag-mark.is-left .flag-text {
  left: auto;
  right: 58px;
  align-items: flex-end;
  text-align: right;
}
.flag-mark.is-reached .flag-text span {
  color: var(--done);
}
.flag-mark:hover .flag-text b,
.flag-mark:focus-visible .flag-text b {
  color: var(--brown);
}

/* Today: the snail rides the line. */
.now {
  position: absolute;
  bottom: calc(var(--line-y) + 1px);
  translate: -88% 0;
  z-index: 3;
}
.snail {
  width: 44px;
  height: 26px;
  overflow: visible;
  display: block;
}
.snail-body {
  fill: var(--p-sand);
}
.snail-body circle {
  fill: var(--brown);
}
.snail-horn {
  fill: none;
  stroke: var(--p-sand);
  stroke-width: 1.6;
  stroke-linecap: round;
}
.snail-shell circle {
  fill: var(--p-clay);
}
.snail-spiral {
  fill: none;
  stroke: var(--card);
  stroke-width: 1.7;
  stroke-linecap: round;
}

/* Movement, only for people who have not asked their computer for less of it. Smoke shows
   still (and fully readable) when motion is reduced. */
@media (prefers-reduced-motion: no-preference) {
  .snail-body {
    animation: stretch 2.6s ease-in-out infinite;
    transform-origin: 0 100%;
  }
  .snail-shell {
    animation: bob 2.6s ease-in-out infinite;
    transform-origin: 17px 21px;
  }
  .cake-flame {
    animation: flicker 1.3s ease-in-out infinite alternate;
  }
  .smoke {
    opacity: 0;
    animation: smoke 4.5s ease-out var(--delay) infinite;
  }
  .flag-cloth {
    animation: wave 2.4s ease-in-out infinite;
  }
  .flag-mark.just-reached {
    animation: raise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1.2) both;
  }
}
@keyframes stretch {
  50% {
    transform: scaleX(1.07);
  }
}
@keyframes bob {
  50% {
    transform: translate(1.2px, -0.6px) rotate(-3deg);
  }
}
@keyframes flicker {
  0% {
    transform: scale(1, 1) rotate(-3deg);
  }
  50% {
    transform: scale(0.88, 1.12) rotate(2deg);
  }
  100% {
    transform: scale(1.05, 0.92) rotate(-1deg);
  }
}
@keyframes smoke {
  0% {
    opacity: 0;
    transform: translate(0, 4px) scale(0.85);
  }
  20% {
    opacity: 0.95;
  }
  70% {
    opacity: 0.7;
  }
  100% {
    opacity: 0;
    transform: translate(4px, -20px) scale(1.05);
  }
}
@keyframes wave {
  0%,
  100% {
    transform: skewY(0deg) scaleX(1);
  }
  30% {
    transform: skewY(-5deg) scaleX(0.94);
  }
  65% {
    transform: skewY(4deg) scaleX(1.03);
  }
}
@keyframes raise {
  from {
    height: 6px;
    opacity: 0.4;
  }
}

/* One column per year; cards stack top to bottom by month. */
.columns {
  display: flex;
  align-items: flex-start;
  margin-top: 6px;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 0 5px;
  min-height: 120px;
  contain: layout paint;
}
.card {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px;
  align-items: start;
  padding: 8px 10px 8px 9px;
  background: var(--card);
  border-left: 3px solid var(--c);
}
.tick {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-top: 2px;
  padding: 0;
  border: 1.5px solid var(--line-strong);
  border-radius: 4px;
  background: var(--card);
  color: var(--done);
  cursor: pointer;
}
.tick:hover {
  border-color: var(--brown);
}
.tick .ico {
  width: 13px;
  height: 13px;
  stroke-width: 2.6;
}
.card-body {
  all: unset;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  cursor: pointer;
}
.card-body:focus-visible {
  outline: 2px solid var(--brown);
}
.card-title {
  font-size: var(--fs-m);
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.card-note {
  font-size: var(--fs-s);
  color: var(--soft);
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-line;
}
.card-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 2px 8px;
  font-size: var(--fs-xs);
  color: var(--soft);
  font-variant-numeric: tabular-nums;
}
.card.is-done .card-title,
.card.is-done .card-note {
  color: var(--soft);
}
.card.is-done .tick {
  border-color: var(--done);
}
.card-done {
  color: var(--done);
  white-space: nowrap;
  margin-left: auto;
}
.add-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  border: 1px dashed var(--line-strong);
  border-radius: 6px;
  background: transparent;
  color: var(--soft);
  font-size: var(--fs-s);
  cursor: pointer;
}
.add-card:hover {
  color: var(--brown);
  border-color: var(--brown);
}

/* Dialog, menu, toast. */
.shade {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 16px;
  background: var(--shade);
}
.dlg {
  width: min(420px, 100%);
  max-height: calc(100% - 32px);
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px;
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--lift);
}
.dlg-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dlg-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: var(--fs-l);
  font-weight: 600;
}
.dlg-body {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.dlg-lead {
  margin: 0;
  font-weight: 600;
}
.dlg-body p {
  margin: 0;
  color: var(--text);
  font-size: var(--fs-m);
}
.dlg-error {
  margin: 0;
  color: var(--warn);
  font-size: var(--fs-s);
}
.dlg-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}
.icon-btn {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--soft);
  cursor: pointer;
}

<script>
// Always the newest version: GitHub Pages lets browsers (and Notion) keep this page for up to
// 10 minutes after an update. Ask the server, bypassing that copy, which program file is
// current; if it is not the one running here, reopen once at an address no copy exists for.
(function () {
  var running = document.querySelector('script[type="module"]');
  var mine = running ? running.getAttribute('src') : '';
  fetch(location.pathname + '?fresh=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (html) {
      var m = html.match(/<script type="module" src="([^"]+)"/);
      if (!m || m[1] === mine) return;
      try {
        if (sessionStorage.getItem('roadmap-updated-to') === m[1]) return;
        sessionStorage.setItem('roadmap-updated-to', m[1]);
      } catch (e) { /* no storage: the address change below still differs each version */ }
      var next = new URL(location.href);
      next.searchParams.set('u', m[1].replace(/[^A-Za-z0-9]/g, ''));
      location.replace(next.toString());
    })
    .catch(function () { /* offline: keep the copy we have */ });
})();
</script>
<script>
// If the program file never arrives (network, an old cached page), say so instead of waiting.
setTimeout(function () {
  var waiting = document.querySelector('#roadmap > .loading');
  if (waiting) waiting.textContent = '路線圖沒有載入成功。請重新整理 Notion（⌘R）；還是不行就截圖給 Claude。';
}, 8000);
</script>
