<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes</title>
<style>
  :root{--bg:#F7F4EE;--head:#2B2B2B;--sub:#8A8276}
  @media (prefers-color-scheme: dark){:root{--bg:#252320;--head:#EDE7DC;--sub:#A69E92}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);font-family:Georgia,"Times New Roman",serif}
  #stage{position:relative;height:100%;width:100%}
  .q{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
     text-align:center;padding:10px 40px;opacity:0;transition:opacity 1.2s ease}
  .q.on{opacity:1}
  .head,.body{white-space:nowrap;max-width:100%}
  .head{color:var(--head);font-weight:600;line-height:1.35}
  .body{color:var(--sub);font-style:italic;line-height:1.5;margin-top:.5em}
  @media (max-width:500px){.q{padding:8px 16px}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
var QUOTES=[
 {h:"Don't try to predict the future. Build a life that allows you to benefit from the unexpected.",
  b:"The aim isn't to get everything right, but to put yourself in a position where, even when things don't go to plan, you can still come out ahead."},
 {h:"Small failures are the price of learning. It's when you suppress them or refuse to learn from them that the real damage is done.",
  b:"Don't shy away from setbacks. Small setbacks are part of what builds resilience and protects you from being brought down by a much bigger failure later on."},
 {h:"Look for opportunities where the downside is limited but the upside is potentially unlimited.",
  b:"Before making a decision, ask yourself: what's the most I could lose, and how much could I stand to gain? Prioritise opportunities where the potential reward far outweighs the risk."},
 {h:"Don't waste your energy worrying about things that are beyond your control.",
  b:"You can't change everyone's mind, and you certainly can't reason with everyone. Know where your influence ends, and learn to let go of what you cannot change."}
];
var INTERVAL=30000, MAX=20, MIN=8, stage=document.getElementById('stage'), els=[], cur=0;

QUOTES.forEach(function(q){
  var d=document.createElement('div');d.className='q';
  var h=document.createElement('div');h.className='head';h.textContent=q.h;
  var b=document.createElement('div');b.className='body';b.textContent=q.b;
  d.appendChild(h);d.appendChild(b);stage.appendChild(d);els.push(d);
});

// Each line stays on ONE line: shrink its own font until it fits the width,
// then shrink both together if the pair is still taller than the box.
var HEAD_MAX=20, BODY_MAX=15;
function fitLine(el,max,width){
  var s=max;el.style.fontSize=s+'px';
  while(s>MIN && el.scrollWidth>width){s-=0.25;el.style.fontSize=s+'px';}
  return s;
}
function fitAll(){
  els.forEach(function(d){
    var h=d.firstChild,b=d.lastChild,cs=getComputedStyle(d);
    var w=d.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    var availH=d.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    var hs=fitLine(h,HEAD_MAX,w), bs=fitLine(b,BODY_MAX,w);
    var used=(b.offsetTop+b.offsetHeight)-h.offsetTop;
    if(used>availH){var k=availH/used;h.style.fontSize=Math.max(MIN,hs*k)+'px';b.style.fontSize=Math.max(MIN,bs*k)+'px';}
  });
}
function show(i){els[cur].classList.remove('on');cur=i;els[cur].classList.add('on');}

fitAll();
show(Math.floor(Math.random()*QUOTES.length));
setInterval(function(){show((cur+1)%QUOTES.length);},INTERVAL);
var t;window.addEventListener('resize',function(){clearTimeout(t);t=setTimeout(fitAll,100);});
</script>
</body>
</html>
